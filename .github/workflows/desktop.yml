# 桌面版发布 —— Electron 壳安装包 → 自托管下载服务器
#
# 触发：推送 v* 标签（与 publish.yml 的 npm 发布同标签并行、互不依赖）。
# 产物：Windows nsis 安装包（AgentChat-Setup-x.y.z.exe）+ Linux AppImage
#       + macOS dmg/zip（arm64 + x64 双架构，未签名——Gatekeeper 首启需右键打开）。
#       2026-09 分发自托管裁决（remote-client-relay-plan §4.6）：不再上传
#       GitHub Releases——windows 腿 rsync 安装包到下载服务器（secrets：
#       SERVER_HOST/SERVER_USER/SSH_PRIVATE_KEY），服务器侧 gen-manifest
#       生成 manifest.json，后续版本拉回 git 双写（git = sha256 信任锚）。
#       未配 secrets 时优雅降级：跳过上传，安装包留在 Actions artifact。
#
# 依赖顺序：pnpm build:frontend → pnpm build:bundle 产出 dist/（后端单文件
# bundle + plugin-catalog.json + WebUI 静态产物），extraResources 原样带入
# resources/agentchat/——与 npm 包同源，插件目录清单随包走。
name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: --win
          - os: ubuntu-latest
            targets: --linux
          - os: macos-latest
            targets: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本取自根 package.json 的 packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 依赖卫生检查
        run: pnpm check:deps

      - name: 构建前端
        run: pnpm build:frontend

      - name: 构建发布 bundle（dist/）
        run: pnpm build:bundle

      # 产物上传走 GitHub Releases draft（2026-09-24 提速裁决）：runner → Releases
      # 走 GitHub 内网秒传；下载服务器在收尾 job 反向拉取（服务器 → GitHub 方向
      # 带宽好）——取代此前三腿 scp 直推（境外 → 境内 ~5Mbps，600MB 传 16 分钟/腿，
      # 三腿累计 40+ 分钟）。draft 不公开，下载面仍指向自托管（分发裁决不变）。
      - name: 打包桌面安装包（上传 Releases draft——中转提速）
        working-directory: desktop
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.targets }} --publish always 2>&1 | tee eb-build.log || {
            echo '--- electron-builder 诊断 ---' | tee -a eb-build.log
            npx electron-builder --version | tee -a eb-build.log || true
            echo "GH_TOKEN len: ${#GH_TOKEN} prefix: ${GH_TOKEN:0:4}" | tee -a eb-build.log
            exit 1
          }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 上传打包诊断（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eb-diagnostic-${{ matrix.os }}
          path: desktop/eb-build.log
          if-no-files-found: ignore

      # ---- 三腿各传各的产物（文件名不冲突）；manifest 重算在收尾 job ----
      # ---- 发布闸基准（2026-09 用户反馈安装包损坏）：上传前算 CI 侧
      # sha256 清单进 artifact——manifest job 读回服务器字节比对，不一致
      # = 发布 fail，异常包绝不进 manifest/下载面。
      - name: 计算产物 sha256 清单（CI 侧基准）
        shell: bash
        run: |
          set -euo pipefail
          # 写 workspace 相对路径（sha-baseline/）：/tmp 在 windows 腿有 git-bash（映射
          # %TEMP%）与 upload-artifact node 进程（当 C:\tmp）的路径语义分裂——v0.8.14
          # 首发 windows 腿 artifact 找不到文件的根因。
          mkdir -p sha-baseline
          : > sha-baseline/SHA256SUMS
          shopt -s nullglob
          for f in desktop/release/*.exe desktop/release/*.dmg desktop/release/*.zip desktop/release/*.AppImage; do
            case "$f" in *.blockmap) continue ;; esac
            # basename 规范化：windows 腿 git-bash 下路径分隔符差异不影响 $(basename)
            echo "$(sha256sum "$f" | awk '{print \$1}')  $(basename "$f")" >> sha-baseline/SHA256SUMS
          done
          cat sha-baseline/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sha-baseline-${{ matrix.os }}
          path: sha-baseline/SHA256SUMS
          if-no-files-found: error

      # （scp 直推已退役——见「打包桌面安装包」步骤注释；服务器拉取在 manifest job）

      # （windows 腿 scp 同上退役）

  # ---- 收尾：三腿产物齐后重算 manifest（消除并发写冲突）----
  manifest:
    needs: build
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 发布闸（2026-09 用户反馈安装包损坏）：拉三腿 CI 侧 sha256 基准，
      # 与服务器上已上传字节逐文件比对——不一致 = 本 job fail，gen-manifest
      # 不执行，异常包绝不进 manifest/下载面（scp 传输损坏/磁盘坏块/并发
      # 写串包在此拦下）。客户端侧另有第二道闸（壳层下载后 sha256 校验）。
      - uses: actions/download-artifact@v4
        with:
          pattern: sha-baseline-*
          path: sha-baseline
          merge-multiple: true
      # ---- 服务器从 Releases draft 拉取产物（2026-09-24 提速裁决）----
      # 方向反转：服务器 → GitHub（境内 → 境外，带宽好）取代三腿 scp 直推。
      # draft 不公开：服务器侧带 GH_TOKEN 走 assets API 拉取；token 经 SSH 环境
      # 变量注入，只在会话内存中用完即弃（不落盘）。拉完删除 draft release
      #（GitHub 不留安装包——分发裁决不变，服务器是唯一正本）。
      - name: 服务器拉取 Releases draft 产物 + 清理中转
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GH_REPO_CTX: ${{ github.repository }}
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning::未配置 secrets——跳过拉取"
            exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(node -p "require('./desktop/package.json').version")"
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # 服务器侧拉取脚本（heredoc 全程经 SSH stdin，不落服务器盘）
          ssh -i ~/.ssh/deploy_key "${SERVER_USER:-deploy}@$SERVER_HOST" \
            VER="$VER" GH_REPO="$GH_REPO_CTX" GH_TOKEN_JOB="$GH_JOB_TOKEN" bash -s <<'PULL'
          set -euo pipefail
          DEST="/var/www/agentchat/downloads/$VER"
          mkdir -p "$DEST"
          # 找本 tag 的 draft release（electron-builder 以 tag 名建 draft）
          TAG="v$VER"
          REL_ID=$(curl -sS -H "Authorization: token $GH_TOKEN_JOB" \
            "https://api.github.com/repos/$GH_REPO/releases" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const rs=JSON.parse(d);const r=rs.find(x=>x.draft&&x.tag_name===process.argv[1]);console.log(r?r.id:"")})' "$TAG")
          if [ -z "$REL_ID" ]; then echo "PULL-ERR: draft release $TAG 未找到"; exit 1; fi
          ASSETS=$(curl -sS -H "Authorization: token $GH_TOKEN_JOB" \
            "https://api.github.com/repos/$GH_REPO/releases/$REL_ID/assets")
          COUNT=$(echo "$ASSETS" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{console.log(JSON.parse(d).filter(a=>!/blockmap$/.test(a.name)).length)})')
          echo "[pull] draft $TAG：$COUNT 个产物 → $DEST"
          echo "$ASSETS" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{for(const a of JSON.parse(d)){if(!/blockmap$/.test(a.name))console.log(a.browser_download_url+"\t"+a.name)}})' \
            | while IFS=$'\t' read -r URL NAME; do
                echo "[pull] $NAME"
                curl -sSL -H "Authorization: token $GH_TOKEN_JOB" -o "$DEST/$NAME" "$URL"
              done
          # 中转清理：删 draft release（GitHub 不留安装包）
          curl -sS -X DELETE -H "Authorization: token $GH_TOKEN_JOB" \
            "https://api.github.com/repos/$GH_REPO/releases/$REL_ID" \
            && echo "[pull] draft release 已清理（GitHub 不留安装包）"
          PULL
      - name: 读回校验（服务器字节 vs CI 基准，防发布异常安装包）
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning::未配置 secrets——跳过校验"
            exit 0
          fi
          BASELINE=sha-baseline/SHA256SUMS
          if [ ! -s "$BASELINE" ]; then
            echo "::error::CI 侧 sha256 基准缺失（三腿 artifact 未齐）"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(node -p "require('./desktop/package.json').version")"
          fi
          REMOTE_DIR="/var/www/agentchat/downloads/$VER"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # 远端整目录哈希清单一次取回（免逐文件 ssh 往返）
          REMOTE_SUMS="$(ssh -i ~/.ssh/deploy_key "${SERVER_USER:-deploy}@$SERVER_HOST" "cd '$REMOTE_DIR' && sha256sum * 2>/dev/null" || true)
          if [ -z "$REMOTE_SUMS" ]; then
            echo "::error::服务器 $REMOTE_DIR 无任何产物——上传步骤异常"
            exit 1
          fi
          FAIL=0
          while read -r sha name; do
            [ -n "$sha" ] || continue
            REMOTE_SHA="$(printf '%s\n' "$REMOTE_SUMS" | awk -v n="$name" '$2 == n {print \$1; exit}')"
            if [ -z "$REMOTE_SHA" ]; then
              echo "::error::$name 服务器上缺失（读回清单无此文件）"
              FAIL=1
            elif [ "$REMOTE_SHA" != "$sha" ]; then
              echo "::error::$name 哈希不符：CI=$sha 服务器=$REMOTE_SHA——疑似上传损坏，已阻断发布"
              FAIL=1
            else
              echo "✓ $name 校验通过"
            fi
          done < "$BASELINE"
          exit $FAIL
      - name: 重算 manifest（服务器侧扫描）
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_HOST:-}" ] || [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning::未配置 secrets——跳过"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # gen-manifest 顺带同步最新脚本（--keep 3：保留最近 3 版，更旧版本目录退役——
          # 小磁盘防膨胀；每版约 600MB，3 版 ≈ 1.8GB 上限）
          scp -i ~/.ssh/deploy_key src/ac-relay-server/scripts/gen-manifest.mjs "${SERVER_USER:-deploy}@$SERVER_HOST:/opt/agentchat-relay/gen-manifest.mjs"
          ssh -i ~/.ssh/deploy_key "${SERVER_USER:-deploy}@$SERVER_HOST" "node /opt/agentchat-relay/gen-manifest.mjs /var/www/agentchat/downloads --keep 3"
          echo "manifest 已重算（三腿产物齐全，旧版本已按 --keep 3 退役）"
