name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd webui/client && npm ci

      - name: Build & Package portable release
        run: npm run build:release

      - name: Create zip
        shell: powershell
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path release/AgentChat -DestinationPath "release/AgentChat-v$version-win-x64.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: release/AgentChat-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
