name: Release

on:
  push:
    tags:
      - 'v*'

# 允许 Actions 创建 Release
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd webui/client && npm ci

      # 缓存 Node.js 便携版 zip（30MB），避免每次 CI 重复下载
      - name: Restore Node.js portable cache
        uses: actions/cache@v4
        id: node-cache
        with:
          path: .cache
          key: node-portable-v24.18.0-win-x64

      - name: Build & Package portable release
        run: npm run build:release

      - name: Create zip (tar, ~10x faster than Compress-Archive)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          tar -a -cf "release/AgentChat-v${VERSION}-win-x64.zip" -C release AgentChat

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: CHANGELOG.md
          files: release/AgentChat-v*.zip
