name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd webui/client && npm ci

      - name: Restore Node.js portable cache
        uses: actions/cache@v4
        id: node-cache
        with:
          path: .cache
          key: node-portable-v24.18.0-win-x64

      - name: Build & Package portable release
        run: npm run build:release

      - name: Get version info
        id: version
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          SHORT=$(git rev-parse --short HEAD)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT

      - name: Create zip
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHORT="${{ steps.version.outputs.short }}"
          LATEST_ZIP="AgentChat-latest-win-x64.zip"
          VERSIONED_ZIP="AgentChat-v${VERSION}-${SHORT}-win-x64.zip"
          tar -a -cf "release/${LATEST_ZIP}" -C release AgentChat
          cp "release/${LATEST_ZIP}" "release/${VERSIONED_ZIP}"

      # ══════ push to main: update a rolling "latest" pre-release ══════
      - name: Update latest pre-release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "latest"
          name: "Latest Build"
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          body: |
            🔄 自动构建自 `main` 分支。

            **版本**: ${{ steps.version.outputs.version }}
            **Commit**: `${{ steps.version.outputs.short }}`

            双击 `start.bat` 即可运行。
            更新方法：双击 `update.bat`。
          artifacts: "release/AgentChat-latest-win-x64.zip"

      # ══════ tag push: create a versioned release ══════
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: CHANGELOG.md
          files: release/AgentChat-v*.zip
