name: Release

on:
  push:
    branches:
      - release
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd webui/client && npm ci

      - name: Restore Node.js portable cache
        uses: actions/cache@v4
        id: node-cache
        with:
          path: .cache
          key: node-portable-v24.18.0-win-x64

      - name: Build & Package portable release
        run: npm run build:release

      - name: Get version info
        id: version
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          SHORT=$(git rev-parse --short HEAD)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT

      - name: Create zip
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHORT="${{ steps.version.outputs.short }}"
          LATEST_ZIP="AgentChat-latest-win-x64.zip"
          VERSIONED_ZIP="AgentChat-v${VERSION}-${SHORT}-win-x64.zip"
          # GNU tar -a falls back to plain tar (not zip) on some runners.
          # Python zipfile is the most reliable cross-platform option.
          python -c "
import zipfile, os
src='release/AgentChat'
out='release/${LATEST_ZIP}'
if os.path.exists(out): os.remove(out)
with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
    for root,dirs,files in os.walk(src):
        for f in files:
            p=os.path.join(root,f)
            z.write(p, os.path.relpath(p, 'release'))
print('zip created')
"
          cp "release/${LATEST_ZIP}" "release/${VERSIONED_ZIP}"

      # ══════ push to release: delete old "latest" release, then create fresh one ══════
      - name: Delete old latest tag & release
        if: github.ref == 'refs/heads/release'
        shell: bash
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" | \
            jq -r '.id // empty')
          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting old release #$RELEASE_ID ..."
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
          else
            echo "No existing 'latest' release found."
          fi

          if git ls-remote --tags origin refs/tags/latest | grep -q latest; then
            echo "Deleting old 'latest' tag..."
            git push origin --delete latest || true
          fi

      - name: Create latest pre-release
        if: github.ref == 'refs/heads/release'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "latest"
          name: "Latest Build"
          draft: false
          prerelease: true
          body: |
            🔄 自动构建自 `release` 分支。

            **版本**: ${{ steps.version.outputs.version }}
            **Commit**: `${{ steps.version.outputs.short }}`

            双击 `start.bat` 即可运行。
            更新方法：双击 `update.bat`。
          artifacts: "release/AgentChat-latest-win-x64.zip"

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          body_path: CHANGELOG.md
          files: release/AgentChat-v*.zip
