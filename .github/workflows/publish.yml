# npm 发布 —— Trusted Publishing（OIDC）
#
# 无需任何 npm token：npm >= 11.5 在 id-token: write 权限下自动用
# GitHub OIDC 换取一次性短时令牌。前提（npmjs.com 配置，仅需一次）：
#   登录 npmjs.com → https://www.npmjs.com/package/agentchat/access →
#   添加 trusted publisher：
#     repository owner: nefevcore
#     repository name:  AgentChat
#     workflow:         publish.yml
#     environment:      （留空）
#
# 触发：推送 v* 标签，或 Actions 页面手动 workflow_dispatch。
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # npm trusted publishing（OIDC）必需
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # 自带 npm ≥ 11.5（trusted publishing 最低要求）
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 依赖卫生检查
        run: pnpm check:deps

      # 前端构建先于测试：csp-audit 审计的就是构建产物（dist 缺席会红）
      # 诊断模式（2026-09-24 v0.8.14 三连败均折在此步且匿名 API 拿不到日志）：
      # 构建输出 tee 落盘 + 失败时上传 artifact（匿名可拉），环境信息一并落盘。
      - name: 构建前端
        run: |
          set -o pipefail
          pnpm build:frontend 2>&1 | tee build-frontend.log || {
            echo '--- 环境/路径诊断 ---' | tee -a build-frontend.log
            node -p '"node " + process.version + " / " + process.platform' | tee -a build-frontend.log
            { ls -la node_modules/@vue-office
              ls src/ac-client-ui-workspace/node_modules/@vue-office
              ls src/ac-client-ui-usage/node_modules/ | grep -E 'uplot|d3' 
              ls src/webui/node_modules/ | grep uplot
              find node_modules/.pnpm -maxdepth 1 -name '@vue-office*' -o -maxdepth 1 -name 'uplot*'
              ls src/webui/public/vendor
            } >> build-frontend.log 2>&1 || true
            exit 1
          }
      - name: 上传构建诊断（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-frontend-diagnostic
          path: build-frontend.log
          if-no-files-found: ignore

      - name: 测试
        run: pnpm test

      - name: 构建发布 bundle（dist/）
        run: pnpm build:bundle

      # npm ≥ 11.5 才支持 trusted publishing（OIDC）。node 自带 npm 版本随小版本波动
      #（24.21 自带 10.9.9 → E401；0.8.13 时 24.2x 自带 11.x 恰好过）——显式升级钉死
      - name: 升级 npm ≥ 11.5（OIDC trusted publishing 最低要求）
        run: |
          npm install -g npm@11
          hash -r
          npm --version
      - name: 发布到 npm（OIDC，无需 token）
        run: |
          set -o pipefail
          npm publish 2>&1 | tee npm-publish.log || {
            echo '--- npm 诊断 ---' | tee -a npm-publish.log
            npm --version | tee -a npm-publish.log
            node -p 'process.version' | tee -a npm-publish.log
            exit 1
          }
      - name: 上传 npm 发布诊断（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-publish-diagnostic
          path: npm-publish.log
          if-no-files-found: ignore
