apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.agentchat.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.agentchat.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 版本单源 = mobile/app/package.json（cr-306：CI 产物名/清单/ APK 内版本同源，
        // 避免产物叫 0.1.0 而装机显示 1.0.0 的漂移）；versionCode 与客户端派生规则
        // 同算法（每段 ×1000 累乘）。
        def pkgJson = rootProject.file('../package.json')
        def pkgVersion = pkgJson.exists() ? new groovy.json.JsonSlurper().parseText(pkgJson.text).version : '0.1.0'
        versionCode pkgVersion.split('[.]').collect { it.toInteger() }.inject(0) { acc, p -> acc * 1000 + p }
        versionName pkgVersion
        // 构建时间标识：adb install -r 未真正替换时可一眼看出（M3.3 实测踩坑）
        buildConfigField "String", "BUILD_TAG", "\"${System.currentTimeMillis()}\""
        // 版本清单地址（M3.5：信任锚 = git raw HTTPS；缺省指向生产下载面——cr-81 修正，
        // 原缺省 127.0.0.1:18080 是本地联调残留，真机每次启动必检查失败）。
        // 本地联调用 -PupdateManifestUrl=... 覆盖。清单可信性靠 HTTPS + 落地前 sha256 校验，
        // 故它**不必**与下载面同源（方案 §4.6「版本清单与信任锚分离」）。
        // 注：下载面当前是明文 HTTP（HTTPS 需备案域名，审计遗留项），手机端
        // network_security_config 只放行 loopback/局域网——真机上此检查会因
        // cleartext 策略失败（fail-closed，不阻断启动）；HTTPS 部署后自然通。
        def manifestUrl = project.findProperty('updateManifestUrl') ?: 'http://47.110.63.135/downloads/manifest.json'
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"" + manifestUrl + "\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // 传输半边以源码形式编入（方案 §2.4：transport 是独立可测模块，JVM 侧测试不变）
    sourceSets {
        main {
            // 传输半边（Noise/relay/回环桥/android 子包）+ 本模块 Kotlin 源
            java.srcDirs += ['../../../transport/src/main/kotlin', 'src/main/kotlin']
        }
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // BuildConfig.BUILD_TAG（构建时间戳）——AGP 8 起默认不生成 BuildConfig，
    // 必须显式开启。它的作用是让「设备上跑的到底是哪次构建」可被一眼确认
    // （adb install -r 不替换 APK 会让人对着新源码排旧代码的 bug）。
    buildFeatures {
        buildConfig = true
    }
    // 构建标识开关（真机排障用：确认设备上跑的是哪次构建）
    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // 生物识别门（M3.4「锁」行）：解锁才连 relay——丢机缓解纵深
    implementation "androidx.biometric:biometric:$androidxBiometricVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ---- 传输半边依赖（与 mobile/transport 的 JVM 构建同版本）----
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.ktor:ktor-server-core:2.3.12'
    implementation 'io.ktor:ktor-server-cio:2.3.12'
    implementation 'io.ktor:ktor-server-websockets:2.3.12'
    implementation 'org.slf4j:slf4j-nop:2.0.13'

    // MainActivity 的 lifecycleScope（等桥就绪）
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // ---- 配对扫码（cr-43 ③：App 自带扫码替代系统相机/微信 + 深链跳回）----
    implementation "androidx.camera:camera-core:$androidxCamVersion"
    implementation "androidx.camera:camera-camera2:$androidxCamVersion"
    implementation "androidx.camera:camera-lifecycle:$androidxCamVersion"
    implementation "androidx.camera:camera-view:$androidxCamViewVersion"
    implementation "com.google.zxing:core:$zxingVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
