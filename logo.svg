<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 气泡外壳（品牌记忆：对话） -->
  <path d="M48 44h160c24 0 44 20 44 44v44c0 24-20 44-44 44H68l-28 28v-28c-24 0-44-20-44-44V88c0-24 20-44 44-44h8z"
        fill="url(#bg)" opacity="0.12"/>
  <path d="M52 48h152c22 0 40 18 40 40v40c0 22-18 40-40 40H72l-24 24v-24c-22 0-40-18-40-40V88c0-22 18-40 40-40h4z"
        fill="url(#bg)" opacity="0.92"/>
  <path d="M52 132l22-6v26l-22 3z" fill="#7c3aed" opacity="0.55"/>
  <path d="M62 58c-7 5-10 13-10 22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- 社区氛围光晕（整体，不指向单节点） -->
  <circle cx="128" cy="116" r="46" fill="url(#halo)"/>

  <!-- 网络连线：mesh 拓扑（环形 + 对角线，度数均衡，无中心） -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <line x1="100" y1="88" x2="156" y2="88"/>
    <line x1="156" y1="88" x2="180" y2="126"/>
    <line x1="180" y1="126" x2="128" y2="146"/>
    <line x1="128" y1="146" x2="76" y2="126"/>
    <line x1="76" y1="126" x2="100" y2="88"/>
    <line x1="100" y1="88" x2="128" y2="146"/>
    <line x1="156" y1="88" x2="128" y2="146"/>
  </g>

  <!-- 节点（白底渐变，大小差异 = 活跃度；拓扑上人人平等） -->
  <circle cx="100" cy="88" r="10" fill="url(#nodeGrad)"/>
  <circle cx="156" cy="88" r="10" fill="url(#nodeGrad)"/>
  <circle cx="180" cy="126" r="8" fill="url(#nodeGrad)"/>
  <circle cx="128" cy="146" r="11" fill="url(#nodeGrad)"/>
  <circle cx="76" cy="126" r="8" fill="url(#nodeGrad)"/>

  <!-- 内核（紫色点，社区成员标识） -->
  <circle cx="100" cy="88" r="4" fill="#7c3aed"/>
  <circle cx="156" cy="88" r="4" fill="#7c3aed"/>
  <circle cx="180" cy="126" r="3.2" fill="#7c3aed"/>
  <circle cx="128" cy="146" r="4.5" fill="#7c3aed"/>
  <circle cx="76" cy="126" r="3.2" fill="#7c3aed"/>
</svg>
