# ============================================================
# scripts/dep-cycles.yml —— 行包依赖违例白名单（M29 P0-1 入册）
#
# 守卫消费方：scripts/check-deps.mjs 的 R6/R7（相位与行图守卫）。
#   · R7：base 行 → domain 行 的静态运行时边（.ts/.vue 同权重）
#   · R6：domain 行 → domain 行 的跨行 .ts 运行时边
#
# **白名单只减不增**（硬纪律，CI 强制）：
#   · 新增边不在本册 = 红；
#   · 边已消化（代码中不存在）而条目未删 = 红；
#   · 每消化一环即删对应条目；清零即除役白名单机制本身。
#
# M29 P2-1 定谳（余量逐边裁决完成）：本册六条全部为终态裁决——
# 「RPC 包装 / 纯工具词 / 惰性取用口 = 契约词汇，不构成相位耦合」。
# 判据：消费的是域行的【类型化 RPC 包装函数、纯展示工具词、或
# 经裁决的惰性服务取用口】——非域行内部状态/store；域行卸载时
# 消费面静默降级（可摘除性保持）。新增 base→domain 边仍一律红灯，
# 新裁决必须显式修订本册。
# ============================================================
edges:
  # ---- M28 §5.1 既有裁决 ----
  - from: ac-client-ui-sidebar
    to: ac-client-ui-system
    ruling: M28 §5.1 显式裁决——版本入口动作跨行消费合法（backupNow/fetchVersion = system 域 RPC 词汇）

  # ---- M28 §4.2① 惰性取用口 + M29 P2-1 定谳 ----
  - from: ac-client-ui-conversation
    to: ac-client-ui-agents
    ruling: M28 §4.2① rosterAccess 惰性取用口（feed/chat-core/AppFrame——pinia 门面退役形态）+ M29 P2-1 定谳：rosterApi 直连（DialogView Token 仪表/删除、ChatInput 池与模型发现）= agent 域 RPC/名册契约词汇；服务态消费一律走 ctx.roster（sessions 服务核心）
  - from: ac-client-ui-layout
    to: ac-client-ui-agents
    ruling: M28 §4.2① rosterAccess 惰性取用口（AppFrame 同形态消费——M29 P2-1 复核维持）

  # ---- M29 P2-1 定谳（RPC 包装 = 契约词汇） ----
  - from: ac-client-ui-conversation
    to: ac-client-ui-workspace
    ruling: M29 P2-1 定谳——fileApi 上传登记门面 = workspace 域 RPC 契约词汇（thin typed wrapper，零域内状态消费；行卸载 = 上传登记静默降级）
  - from: ac-client-ui-conversation
    to: ac-client-ui-skill
    ruling: M29 P2-1 定谳——ChatInput skillsApi（@ 提及的技能清单拉取）= skill 域 RPC 契约词汇（thin typed wrapper；行卸载 = 提及清单空态）
  - from: ac-client-ui-conversation
    to: ac-client-ui-jobs
    ruling: M29 P2-1 定谳——ConversationJobsChip 消费 jobs 域纯工具词（jobStatusLabel/splitJobs 等）+ ctx.jobBoard 服务面（运行期可选能力取用）；行卸载 = 会话头任务入口不渲染
