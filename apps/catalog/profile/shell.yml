# ac-base-version: 6
# shell 进程基座源文档（cr-902 / cr-1022 批2 双区化 / cr-1033 B3 能力
# 定义归包后单区化）：本档只承载骨架区——会话循环结构性前提 + 平台设施
#（恒装面，投影 zone=skeleton）。能力定义事实源 = 各能力包 package.json
# 的 ac.rows（构建期 aggregatePackageRows 聚合 → row-catalog.json 投影
# 携带，消费面经 readCatalog 合并语义读——menu-assembly §六-5）。
# 行定义词汇白名单（cr-1025）：id / name / requires / config——一切带内
# 真值派生词禁入。id 仅基座内唯一（跨基座同名合法）。
# name = link: 仓库相对路径（装载寻址单源）。apps/catalog/row-catalog.json
# 是生成投影（scripts/gen-row-catalog.mjs），禁止手改。
- id: logger-console
  name: link:packages/vendor/logger
  description: 日志基座（两树各计）
- id: config
  name: link:packages/ac-config
  description: 配置（两树各计）
- id: ledger
  name: link:packages/ac-ledger
  description: 账本：messages.jsonl + journal + inbox 消费 + settlement + usage 自报
- id: conversation
  name: link:packages/ac-shell-conversation
  description: 会话状态机：串行化门 + inbox 双队列 + budget + user 端点桩 + 全量 loop 驱动（M8.2）
  requires:
    - agent-loop
    - ledger
- id: tools
  name: link:packages/ac-tools
  description: 工具注册基座 + 授权门（ac-auth-core 投影，每 run 前重读）
- id: permission-gate
  name: link:packages/ac-permission-gate
  description: 权限门（needPermission/risk 决策序——deny 直效、allow 直通、ask 上抛设置链+approval 审批卡；cr-1066 批1）
- id: llm
  name: link:packages/ac-llm
  description: 模型会话
- id: llm-pool
  name: link:packages/ac-llm-pool
  description: 连接池（凭据直读数据根）
  requires:
    - llm
    - config
- id: agent-loop
  name: link:packages/ac-agent-loop
  description: ReAct 编排
  requires:
    - llm
    - tools
- id: persona
  name: link:packages/ac-persona
  description: 身份数据只读
- id: conduct
  name: link:packages/ac-conduct
  description: 行为基线（专业客观段）
- id: host-face-client
  name: link:packages/ac-host-face-client
  description: 宿主能力面（壳侧：代理工具 timer/update_agent_profile + 远程段 + singles/group Shim——运行时懒装配面，非静态注册）
- id: durable-interaction
  name: link:packages/ac-durable-interaction
  description: 交互承重（数据化 boot）
- id: jobs
  name: link:packages/ac-jobs
  description: 后台任务基座（worker 壳子进程设施）——平台设施裁级行（menu-assembly §三）
