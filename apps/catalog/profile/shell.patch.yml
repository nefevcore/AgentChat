# ac-base-version: 1
# shell 进程基座源文档（cr-902 / cr-901 v2.1 批1）——行→包映射单一事实源。
# 顶层 = cordis-plugin-loader 官方方言条目数组（DSH 同款顶层数组约束）；
# tree 字段由所在文档隐含（id 仅基座内唯一，跨基座同名合法）；
# name = link: 仓库相对路径（多包行 packs 全列——指纹面）；tools/bundle/requires
# 为行集派生词汇（ac-rowset-core）。apps/catalog/row-catalog.json 是本档的
# 生成投影（scripts/gen-row-catalog.mjs），禁止手改。
- id: archive
  name: link:packages/ac-shell-rows
  packs:
    - packages/ac-shell-rows
    - packages/ac-archive-core
  description: 归档编排（阈值检测/整理 run/归档重建全链壳内——D11 全壳内裁决；timer archive-all 改批量唤醒信）
  requires:
    - ledger
    - conversation
    - agent-loop
- id: session-query
  name: link:packages/ac-shell-rows
  description: 会话查询（只搜自己：本 agent 账本只读回放——D10 收敛，cr-544）
  requires:
    - tools
  tools:
    - grep_history
    - read_history
- id: auto-title
  name: link:packages/ac-shell-rows
  description: 会话命名（首步后 LLM 一句概括 → 信封请求宿主 singles 行落盘——cr-672）
- id: logger-console
  name: link:packages/vendor/logger
  description: 日志基座（两树各计）
- id: config
  name: link:packages/ac-config
  description: 配置（两树各计）
- id: ledger
  name: link:packages/ac-ledger
  description: 账本：messages.jsonl + journal + inbox 消费 + settlement + usage 自报
- id: conversation
  name: link:packages/ac-shell-conversation
  description: 会话状态机：串行化门 + inbox 双队列 + budget + user 端点桩 + 全量 loop 驱动（M8.2）
  requires:
    - agent-loop
    - ledger
- id: tools
  name: link:packages/ac-tools
  packs:
    - packages/ac-tools
    - packages/ac-shell-rows
  description: 工具注册基座 + 授权门（ac-auth-core 投影，每 run 前重读）
- id: llm
  name: link:packages/ac-llm
  description: 模型会话
- id: llm-pool
  name: link:packages/ac-llm-pool
  description: 连接池（凭据直读数据根）
  requires:
    - llm
    - config
- id: agent-loop
  name: link:packages/ac-agent-loop
  description: ReAct 编排
  requires:
    - llm
    - tools
- id: persona
  name: link:packages/ac-persona
  description: 身份数据只读
- id: host-face-client
  name: link:packages/ac-host-face-client
  description: 宿主能力面（壳侧：代理工具 timer/update_agent_profile + 远程段 + singles/group Shim——运行时懒装配面，非静态注册）
- id: conduct
  name: link:packages/ac-conduct
  description: 行为基线（专业客观段）
- id: memory
  name: link:packages/ac-memory
  description: 经验数据本壳写
  requires:
    - tools
  tools:
    - memory_grep
    - memory_write
- id: goal
  name: link:packages/ac-goal
  description: 目标
  requires:
    - tools
  tools:
    - goal
- id: todo
  name: link:packages/ac-todo
  description: 待办
  requires:
    - tools
  tools:
    - todo
- id: fs-tools
  name: link:packages/ac-fs-tools
  packs:
    - packages/ac-fs-tools
    - packages/ac-file-snapshots
  description: 文件工具（含 file-snapshots 并入）
  bundle: fs
  requires:
    - tools
  tools:
    - read
    - write
    - edit
- id: fs-search
  name: link:packages/ac-fs-search
  description: 文件检索
  bundle: fs
  requires:
    - tools
  tools:
    - glob
    - grep
- id: str-replace-editor
  name: link:packages/ac-str-replace-editor
  description: 精确替换编辑
  bundle: fs
  requires:
    - tools
  tools:
    - str_replace_editor
- id: shell-tools
  name: link:packages/ac-shell-tools
  description: 命令执行
  bundle: infra
  requires:
    - tools
    - jobs
  tools:
    - pwsh
    - bash
    - job
- id: run-code
  name: link:packages/ac-run-code
  description: 代码编排执行
  bundle: infra
  requires:
    - tools
  tools:
    - run_code
- id: math
  name: link:packages/ac-math
  description: 数学求值
  requires:
    - tools
  tools:
    - math
- id: artifacts
  name: link:packages/ac-artifacts
  description: 产出物引用指引段
- id: web-tools
  name: link:packages/ac-web-tools
  description: web 搜索
  requires:
    - tools
  tools:
    - web_search
- id: browser
  name: link:packages/ac-web-tools
