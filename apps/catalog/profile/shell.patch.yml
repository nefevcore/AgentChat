  requires:
    - tools
    - agent-loop
- id: plugin-dev
  name: link:packages/ac-shell-rows
  description: 插件开发三件套（register 会话级壳内装载 / install·uninstall 永久档信封请求宿主——cr-553）
  requires:
    - tools
    - conversation
  tools:
    - register_plugin
    - install_plugin
    - unregister_plugin
- id: restart
  name: link:packages/ac-shell-rows
  description: 安全重启双件（restart_shell 中止回队续跑 / restart_host 信封请求宿主 graceful 重启——cr-629；创造预设专属 cr-635）
  bundle: creator
  requires:
    - tools
    - conversation
  tools:
    - restart_shell
    - restart_host
