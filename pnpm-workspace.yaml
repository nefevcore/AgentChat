packages:
  - 'src/*'
  - 'src/vendor/*'
  - 'desktop'
  # preview 轨（cr-491，M0.1）：纯库六包——根 tsconfig/vitest include 均不含 preview（不进 CI 门禁）
  - 'preview/packages/*'
  # preview 轨（cr-501，M3.2）：壳/宿主 app 骨架
  - 'preview/apps/*'
  # preview 轨（cr-531，8.5b 第二批）：ui 通道模块（第一方模块资产——manifest 声明 + re-export 主线行包）
  - 'preview/apps/ui/channel/*'
allowBuilds:
  '@vue-office/docx': true
  '@vue-office/excel': true
  '@vue-office/pptx': true
  canvas: false
  electron: true
  electron-winstaller: true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@nefevcore/abap-adt-dsh-plugin@0.6.0'
  - '@nefevcore/abap-adt-mock@0.6.0 || 0.7.0 || 0.7.1 || 0.7.2 || 0.8.1 || 0.10.0 || 0.11.0 || 0.12.0'
  - '@nefevcore/abap-adt-protocol@0.6.0 || 0.7.0 || 0.7.1 || 0.7.2 || 0.8.1 || 0.10.0 || 0.11.0 || 0.12.0'
  - '@nefevcore/abap-adt-core@0.7.0 || 0.7.1 || 0.7.2 || 0.8.1 || 0.10.0 || 0.11.0 || 0.12.0'
