<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AgentChat</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f1420; color: #e8ecf4;
      display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { text-align: center; max-width: 420px; padding: 0 24px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #2a3550; border-top-color: #6c8cff;
      border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    button { margin-top: 12px; padding: 8px 18px; border-radius: 8px; border: none;
      background: #6c8cff; color: #fff; cursor: pointer; font-size: 14px; }
    p { color: #8a94a8; font-size: 14px; line-height: 1.6; }
    .title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <div class="title">正在连接 AgentChat 后端…</div>
    <p id="status">请确认后端已启动（http://localhost:3830）</p>
    <button id="retry" style="display:none">重试</button>
  </div>
  <script>
    const BACKEND = 'http://localhost:3830';
    const spinner = document.querySelector('#spinner');
    const status = document.querySelector('#status');
    const retry = document.querySelector('#retry');

    function fail() {
      status.textContent = '未检测到后端。请先启动 AgentChat 后端，然后重试。';
      retry.style.display = 'inline-block';
      spinner.style.display = 'none';
    }

    function check() {
      fetch(BACKEND + '/api/version')
        .then(r => { if (r.ok || r.status < 500) location.href = BACKEND; else fail(); })
        .catch(fail);
    }

    retry.onclick = () => location.reload();
    check();
    // 后端启动中时每 3s 自动重试，起来后立即跳转
    setInterval(() => { if (!location.href.startsWith(BACKEND)) check(); }, 3000);
  </script>
</body>
</html>
