# ============================================================
# AgentChat 基座 bundle 补丁层（DSH 形态）
#
# 组合方式：本文件是一条对空根（cordis.yml = []）的 insert，
# 行序无激活语义（Loader 按服务依赖 inject 推导）；分组注释即装配一览图。
# 上层（cordis.patch.yml / ~/.agentchat/cordis.patch.yml / --patch）
# 按行 id 定点覆盖 config（整行替换不合并）、disable 或追加行。
#
# 宿主配置（端口等）不再属于"文件事实"：可用 env 覆盖，更推荐
# 用户补丁层按 id 改写（如 boot-finalize / webui 的 webuiPort）。
# ============================================================
- insert:
    # ---- 基建 ----
    - id: logger
      name: '@agentchat/cordis-logger'
      config:
        timestamp: true

    # ---- 通用持久化交互（durable suspension：open/reply/close，JSONL 后端）----
    - id: durable-interaction
      name: '@agentchat/durable-interaction/src/plugin'

    # ---- 静态行 HMR（块 C）：vendor cordis-timer + loader 内部 fiber 暴露 ----
    - id: timer
      name: '@agentchat/cordis-timer'
    # 热更新行默认停用（正式运行不需要）；开发期在用户补丁层翻转：
    #   - id: hmr
    #     disabled: false
    - id: hmr
      name: '@agentchat/cordis-hmr'
      disabled: true
      config:
        root:
          - 'src'
        ignored:
          - '**/node_modules'
          - '**/.*'
          - 'workspace'
          - 'dist'
        debounce: 100
        # Windows/pnpm：packages/*/node_modules 是符号链接；跟随会让 watcher 遍历
        # pnpm store 导致 CPU 100% + 请求挂起。只监视 packages 源码目录。
        followSymlinks: false

    # ---- L3 传输层注册口（宿主只挂中间件/WS/SPA；业务路由由各域行注册）----
    - id: http-host
      name: '@agentchat/server/src/http-plugin'

    # ---- 能力插件行（服务提供者：ctx.agentLoop / ctx.llm / ctx.tools / ctx.hooks）----
    - id: agent-loop
      name: '@agentchat/agent-loop/src/plugin'   # → ctx.agentLoop（ReAct 引擎入口）
    - id: llm
      name: '@agentchat/llm/src/plugin'          # → ctx.llm（LLM 适配器注册表）
    - id: llm-deepseek
      name: '@agentchat/llm-deepseek/src/plugin' # 适配器行：deepseek（inject: llm）
    - id: llm-glm
      name: '@agentchat/llm-glm/src/plugin'      # 适配器行：glm 智谱 GLM-5.3（inject: llm）
    - id: llm-openai
      name: '@agentchat/llm-openai/src/plugin'   # 适配器行：openai + default（inject: llm）
    - id: tools
      name: '@agentchat/tools/src/plugin'        # → ctx.tools（工具注册中心，不再聚合）
    - id: hooks
      name: '@agentchat/hooks/src/plugin'        # → ctx.hooks（builtin 聚合移除，钩子域各自成行）
    - id: plugin-host
      name: '@agentchat/plugins/src/plugin'      # → ctx.pluginHost（动态插件装载器，先于 dev 工具行）
    - id: market
      name: '@agentchat/plugins/src/market/market-plugin' # → ctx.market（市场发现/暂存/安装；构造零网络）
    - id: market-http
      name: '@agentchat/plugins/src/market/http-plugin'   # → /api/plugins/market/*（inject: http+market）

    # ---- 能力插件行（工具领域包：每域一行，inject: tools）----
    - id: fs-tools
      name: '@agentchat/fs/src/plugin'           # read/write/edit 工具
    - id: shell-tools
      name: '@agentchat/shell/src/plugin'        # bash 工具（跨平台 shell 探测）
    - id: web-tools
      name: '@agentchat/web/src/plugin'          # web_search/browser 工具
    - id: dev-tools
      name: '@agentchat/dev/src/plugin'          # 开发工具（code_search/read_logs/reload，dev）
    - id: dev-admin-tools
      name: '@agentchat/dev/src/plugin-admin'    # 插件管理工具（register_tool/register_plugin，admin）
    - id: session-tools
      name: '@agentchat/session-tools/src/plugin' # 会话工具
    - id: restart
      name: '@agentchat/restart/src/plugin'      # system_restart 工具（admin）
    - id: interaction
      name: '@agentchat/interaction/src/plugin'  # ask_questions 工具（用户交互）

    # ---- 能力插件行（扩展域包：每域一行，inject: hooks/tools）----
    - id: agent-prompt
      name: '@agentchat/agent-prompt/src/plugin' # build-system-prompt 钩子
    - id: agent-skill
      name: '@agentchat/agent-skill/src/plugin'  # discovered_skills 技能注入钩子
    - id: agent-session
      name: '@agentchat/agent-session/src/plugin' # load-history/save-session 钩子
    - id: agent-memory
      name: '@agentchat/agent-memory/src/plugin' # load-memory 钩子
    - id: agent-mcp
      name: '@agentchat/agent-mcp/src/plugin'    # open-mcp 钩子
    - id: security
      name: '@agentchat/security/src/plugin'     # security-check 钩子
    - id: agent-tools
      name: '@agentchat/agent-tools/src/plugin'  # 协作工具（inject: tools）

    # ---- 能力插件行（工具注册：inject: tools）----
    - id: timer-tools
      name: '@agentchat/timer/src/plugin'        # timer 工具（定时任务 5 种调度 + chime）
    - id: subagent-tools
      name: '@agentchat/subagent/src/plugin'     # subagent 工具（子 Agent 委托）
    - id: math-tools
      name: '@agentchat/math/src/plugin'         # math 共享工具（vm 沙箱求值）

    # ---- 核心装配（L2：boot 只做契约接线）----
    - id: boot-core
      name: '@agentchat/boot/src/plugin'
    - id: workspace-init
      name: '@agentchat/workspace/src/plugin'
    - id: archive
      name: '@agentchat/archive/src/plugin'
    - id: timer-service
      name: '@agentchat/timer/src/service-plugin'
    - id: subagent-service
      name: '@agentchat/subagent/src/service-plugin'
    - id: server-l4
      name: '@agentchat/server/src/service-plugin'
    - id: boot-finalize
      name: '@agentchat/boot/src/plugin-finalize'
      config:
        enableWebUI: true
        webuiPort: 3830

    # ---- L3 业务路由行（挂/摘行 = 挂/摘对应 /api/*）----
    - id: http-routes
      name: '@agentchat/server/src/http-routes-plugin'  # upload/config/browse/workspace/backup/version/usage/sessions
    - id: plugins-http
      name: '@agentchat/plugins/src/http-plugin'        # /api/plugins（inject pluginManager）
    - id: diagnostics
      name: '@agentchat/boot/src/plugin-diagnostics'    # 装配缺口诊断（删服务行 5s 后告警）

    # ---- WebUI 插件行（DSH 风格：inject webServerHost，自行启动 HTTP/WS + SPA 托管）----
    - id: webui
      name: '@agentchat/webui/src/plugin'
      config:
        webuiPort: 3830

    # ---- 链路验证插件 ----
    - id: hello
      name: '@agentchat/hello'
      config:
        targets: ['preview', 'cordis-4', 'monorepo']
