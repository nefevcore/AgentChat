# ============================================================
# AgentChat 表面 bundle —— profile: web-app（base 之上叠加）
#
# 语义：Web 表面 = WebUI 插件行（inject webServerHost，自行启动
# HTTP/WS + SPA 托管）+ boot-finalize 显式启用 WebUI。
# 组合栈（composeLayers 按 profile 组栈，数组序即叠序）：
#   composition.base.yml（本文件之前的基座）
#     ← 本文件（web-app 表面）
#       ← market 动态层 → 用户层 → 机器层 → --patch 覆盖
# 按 id 覆盖 = config 整行替换不合并，故 boot-finalize 覆盖需带全量 config。
# ============================================================
- insert:
    # ---- WebUI 插件行（DSH 风格：inject webServerHost，自行启动 HTTP/WS + SPA 托管）----
    - id: webui
      name: '@agentchat/webui/src/plugin'
      config:
        webuiPort: 3830

# 显式启用 WebUI（表面级决策：web-app 下 AGENTCHAT_NO_WEBUI 让位于 profile）
- id: boot-finalize
  config:
    enableWebUI: true
    webuiPort: 3830
