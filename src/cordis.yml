- id: ui-remote
  name: 'ac-client-ui-remote'
# P1 远程设备前端行（settings:section 贡献：配对二维码/SAS/吊销）
# - id: ui-remote
#   name: 'ac-client-ui-remote'
- id: agent-admin
  name: 'ac-agent-admin'
- id: hmr
  name: '@agentchat/cordis-hmr'
  disabled: true
  config:
    root: []
