  name: 'ac-durable-interaction'
- id: ask-questions
  name: 'ac-ask-questions'
# ---- M12 服务编排（纯库住 ac-archive-core/ac-timer-core/ac-backup-core；
# 行组合决定装载；workspace root = 各持久化行的统一数据根锚点） ----
- id: usage
  name: 'ac-usage'
- id: archive
  name: 'ac-archive'
- id: backup
  name: 'ac-backup'
- id: timers
  name: 'ac-timer'
- id: workspace
  name: 'ac-workspace'
# ---- M13 宿主与可视化（传输基座 + 桥接 + web 表面 + 插件注册；
# 纯库住 ac-ws-protocol/ac-plugin-core/ac-supervisor-core；
# supervisor.mjs 是进程层脚本不经组合根） ----
- id: web-server
  name: 'ac-web-server'
  config:
    port: 3830
    # A1 加固：缺省只绑回环（LAN 不可达）；要暴露到网络必须显式改 host
    # 并自行承担信任边界（配合 allowedOrigins/allowedHosts 放行）
    host: '127.0.0.1'
    # M7：preview WebUI 预构建产物（pnpm --filter ac-webui-app build →
    # preview/webui/dist；SPA fallback 托管，dev 期 vite 3831 proxy → 3830）
    staticDir: './webui/dist'
- id: ws-bridge
  name: 'ac-ws-bridge'
- id: webui
  name: 'ac-webui'
# M30 D7：webui-extensions 行退役（服务端 slot 注册表生产链路零消费——
# 第三方 UI 走 manifest.ui → webui.addEntry → 浏览器 SlotRegistry；
# 词汇表 slotCatalog 留包转纯库，不进本表）
# M27 S3：client-only 行首例（runview 运行矩阵域——boot graph 声明半边）；
# M27.1 改名入 ac-client-ui-* 全族（派生名 ui-runview）
