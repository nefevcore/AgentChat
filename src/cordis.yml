# ac-skill-core/ac-mcp-core/ac-memory-core；行组合决定装载；
# mcp 服务器放行走本行 config.servers，Agent 暴露走 AgentConfig.tools。
# 注意：主档 append 序 ≠ 行序——Loader 路径并发创建行（boot.ts），<available_skills>
# 相对 [引用约定] 组的位置由 ac-skill 收敛式插入策略保证，不靠此处的行序） ----
- id: datetime
  name: 'ac-datetime'
- id: skill
  name: 'ac-skill'
- id: collab-tools
  name: 'ac-collab-tools'
- id: mcp
  name: 'ac-mcp'
  # 放行基线（loader 经行 Config schema 校验：缺 name/类型错 = 行 FAILED）。
  # 运行时清单缺省读数据根 mcp.json（settings.mcp.file 可指向其他文件；
  # 文件存在即整体替换本基线——内容 = { "servers": [...] } 或裸数组，
  # 条件 url（HTTP）或 command+args（stdio）二选一，transport 缺省推断）。
  # 示例基线：
  #   servers:
  #     - name: fs
  #       command: npx
  #       args: ['-y', '@modelcontextprotocol/server-filesystem', '.']
  config:
    servers: []
# ---- M15 对账补齐（timer 工具面 / job 完成唤醒；ac-group 与
# ac-conversation 持久化与各持久化行同根——缺省 AGENTCHAT_DATA_ROOT
# = 启动 cwd（boot.ts 锚定），不再写死行 config.root） ----
- id: timer-tools
  name: 'ac-timer-tools'
- id: job-wakeup
  name: 'ac-job-wakeup'
# ---- M7 WebUI 接线（ac-web-api：WS RPC 业务方法注册薄编排行；
