# ============================================================
# AgentChat src 轨道 —— 配置驱动装配（官方 loader 形态）
#
# 顶层条目表 = include 子树（Loader 官方格式：id/name/config/disabled/inject）。
# 行序无激活语义：Loader 按各行插件的 inject 声明推导依赖（缺服务则该行
# PENDING，服务到位自动激活）。
#
# name = 裸包名（教程/官方形态）：ac-*（根 package.json 声明的 workspace
# 链接）与 @agentchat/cordis-*（vendor 框架行）。解析锚点 = 本文件所在
# 目录（loader 以 baseUrl 为 parentURL 向上走 node_modules）。
# 本地插件直接写相对路径（教程同款：'./my-widget.ts'）。
#
# 启动（官方路径，零自研引导）：
#   cd src && node ./vendor/cordis/bin.js
#   （仓库脚本 pnpm dev）
#
# hmr 行默认 disabled：构造需要 --expose-internals；带 flag 的演示入口
# （pnpm dev:demo）经 include patches 运行时启用，不写回本文件。
# ============================================================
- id: logger-console
  name: '@agentchat/cordis-logger'
- id: timer
  name: '@agentchat/cordis-timer'
- id: tools
  name: 'ac-tools'
- id: jobs
  name: 'ac-jobs'
- id: config
  name: 'ac-config'
- id: agents
  name: 'ac-agents'
- id: llm
  name: 'ac-llm'
# llm provider 注册面 = 配置驱动（llm-provider-model-plan P2）：读 config
# llmProviders 注册连接，config 同名条目覆盖内置种子（openai/deepseek/glm
# 退役适配行的缺省原样平移）；热更走 config/changed。
- id: llm-pool
  name: 'ac-llm-pool'
- id: agent-loop
  name: 'ac-agent-loop'
- id: conversation
  name: 'ac-conversation'
- id: conv-settings
  name: 'ac-conv-settings'
- id: persona
  name: 'ac-persona'
- id: system-prompt
  name: 'ac-system-prompt'
- id: memory
  name: 'ac-memory'
# ---- 任务追踪（goal/todo：goal-round 自主推进 + 工具面；状态经消息面
# 到达模型不改写 system（KV cache）；持久化 agentStore entries
# 'goal'/'todo'——桶键 = conversationId ?? agentId，预设 singles 按 sid
# 天然分桶） ----
- id: goal
  name: 'ac-goal'
- id: todo
  name: 'ac-todo'
- id: bench
  name: 'ac-bench'
# ---- M11 工具面（纯库住 ac-edit-core/ac-sandbox-core/ac-text-budget/
# ac-glob-core/ac-web-search-core；行组合决定装载） ----
- id: fs-tools
  name: 'ac-fs-tools'
- id: fs-search
  name: 'ac-fs-search'
# 会话文件首见快照（方案 C：fs-tools/str-replace-editor 写路径经可选
# 探测消费——本行缺席两工具行不受影响；文件编辑面板的存量初版 diff 底）
- id: file-snapshots
  name: 'ac-file-snapshots'
- id: str-replace-editor
  name: 'ac-str-replace-editor'
- id: shell-tools
  name: 'ac-shell-tools'
# 程序化模式 PTC 内核（run_code 工具：模型写 TS 程序编排成批工具调用；
# 需 code-exec 能力标签；SDK 投影纯库住 ac-run-code-core。程序化形态 =
# 会话级开关（conv-settings programmatic + router 收窄 LLM 面）——
# __programmatic__ 预设已随开关化退役，2026-09-17 research §十）
- id: run-code
  name: 'ac-run-code'
- id: math
  name: 'ac-math'
- id: web-tools
  name: 'ac-web-tools'
# ---- ISSUE 反馈工具行（submit_issue：GitHub/Gitee 创建 ISSUE——用户经
# Agent 直达 Git 的反馈通道；requiredTags ['issue-report']（cr-41 对外
# 发布独立轴）+ needPermission；令牌三源链 = 行直配 → 凭据库（github/
# gitee）→ env GITHUB_TOKEN/GITEE_TOKEN；官方台全空降级预填新建链接） ----
- id: issue-tools
  name: 'ac-issue-tools'
# ---- harness 委托（run_harness：把任务委托给本地 Claude Code/Codex
# CLI——订阅额度复用零 API key；沙箱两档 + agent 维互斥 + needPermission；
# harnessTier 实验键随行注册（conv-settings 实验性组，缺省启用——
# cr-277/278 harness 桥接方案 B） ----
- id: harness-tools
  name: 'ac-harness-tools'
# ---- SAP ABAP ADT 工具面（32 个 adt_* 工具；引擎 = npm abap-adt 的
# host-neutral 入口；工具需 sap-adt 能力标签——Agent tags 显式授予才
# 可见；demo 目的地（进程内 mock）默认可用；配置走行 config <
# config.json `sap-adt:` 段 < configFile，热生效） ----
- id: sap-adt
  name: 'ac-sap-adt'
# ABAP 开发模式预设子行（__abap_dev__ 注入预设目录——工具面与预设面
# 独立装配：摘本行不影响 32 个 adt_* 工具）
- id: durable-interaction
  name: 'ac-durable-interaction'
- id: ask-questions
  name: 'ac-ask-questions'
# ---- M12 服务编排（纯库住 ac-archive-core/ac-timer-core/ac-backup-core；
# 行组合决定装载；workspace root = 各持久化行的统一数据根锚点） ----
- id: usage
  name: 'ac-usage'
- id: backup
  name: 'ac-backup'
- id: workspace
  name: 'ac-workspace'
# ---- M13 宿主与可视化（传输基座 + 桥接 + web 表面 + 插件注册；
# 纯库住 ac-ws-protocol/ac-plugin-core/ac-supervisor-core；
# supervisor.mjs 是进程层脚本不经组合根） ----
- id: web-server
  name: 'ac-web-server'
  config:
    port: 3830
    # A1 加固：缺省只绑回环（LAN 不可达）；要暴露到网络必须显式改 host
    # 并自行承担信任边界（配合 allowedOrigins/allowedHosts 放行）
    host: '127.0.0.1'
    # M7：preview WebUI 预构建产物（pnpm --filter ac-webui-app build →
    # preview/webui/dist；SPA fallback 托管，dev 期 vite 3831 proxy → 3830）
    staticDir: './webui/dist'
- id: ws-bridge
  name: 'ac-ws-bridge'
# M30 D7：webui-extensions 行退役（服务端 slot 注册表生产链路零消费——
# 第三方 UI 走 manifest.ui → webui.addEntry → 浏览器 SlotRegistry；
# 词汇表 slotCatalog 留包转纯库，不进本表）
# M27 S3：client-only 行首例（runview 运行矩阵域——boot graph 声明半边）；
# M27.1 改名入 ac-client-ui-* 全族（派生名 ui-runview）
- id: plugin-market
  name: 'ac-plugin-market'
- id: event-policy
  name: 'ac-event-policy'
# ---- M14 扩展补全（datetime/skill/mcp/协作工具；纯库住
# ac-skill-core/ac-mcp-core/ac-memory-core；行组合决定装载；
# mcp 服务器放行走本行 config.servers，Agent 暴露走 AgentConfig.tools。
# 注意：主档 append 序 ≠ 行序——Loader 路径并发创建行（boot.ts），<available_skills>
# 相对 [引用约定] 组的位置由 ac-skill 收敛式插入策略保证，不靠此处的行序） ----
- id: datetime
  name: 'ac-datetime'
- id: skill
  name: 'ac-skill'
- id: collab-tools
  name: 'ac-collab-tools'
- id: mcp
  name: 'ac-mcp'
  # 放行基线（loader 经行 Config schema 校验：缺 name/类型错 = 行 FAILED）。
  # 运行时清单缺省读数据根 mcp.json（settings.mcp.file 可指向其他文件；
  # 文件存在即整体替换本基线——内容 = { "servers": [...] } 或裸数组，
  # 条件 url（HTTP）或 command+args（stdio）二选一，transport 缺省推断）。
  # 示例基线：
  #   servers:
  #     - name: fs
  #       command: npx
  #       args: ['-y', '@modelcontextprotocol/server-filesystem', '.']
  config:
    servers: []
# ---- M15 对账补齐（timer 工具面 / job 完成唤醒；ac-group 与
# ac-conversation 持久化与各持久化行同根——缺省 AGENTCHAT_DATA_ROOT
# = 启动 cwd（boot.ts 锚定），不再写死行 config.root） ----
- id: remote-link
  name: 'ac-remote-link'
- id: hmr
  name: '@agentchat/cordis-hmr'
  disabled: true
  config:
    root: []
