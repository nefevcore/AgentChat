# ============================================================
# AgentChat src 轨道 —— 配置驱动装配（官方 loader 形态）
#
# 顶层条目表 = include 子树（Loader 官方格式：id/name/config/disabled/inject）。
# 行序无激活语义：Loader 按各行插件的 inject 声明推导依赖（缺服务则该行
# PENDING，服务到位自动激活）。
#
# name = 裸包名（教程/官方形态）：ac-*（根 package.json 声明的 workspace
# 链接）与 @agentchat/cordis-*（vendor 框架行）。解析锚点 = 本文件所在
# 目录（loader 以 baseUrl 为 parentURL 向上走 node_modules）。
# 本地插件直接写相对路径（教程同款：'./my-widget.ts'）。
#
# 启动（官方路径，零自研引导）：
#   cd src && node --import tsx ./vendor/cordis/bin.js
#   （仓库脚本 pnpm dev）
#
# hmr 行默认 disabled：构造需要 --expose-internals；带 flag 的演示入口
# （pnpm dev:demo）经 include patches 运行时启用，不写回本文件。
# ============================================================
- id: logger-console
  name: '@agentchat/cordis-logger'
- id: timer
  name: '@agentchat/cordis-timer'
- id: tools
  name: 'ac-tools'
- id: jobs
  name: 'ac-jobs'
- id: config
  name: 'ac-config'
- id: credentials
  name: 'ac-credentials'
- id: agent-store
  name: 'ac-agent-store'
- id: agents
  name: 'ac-agents'
- id: agents-dir
  name: 'ac-agents-dir'
- id: agent-presets
  name: 'ac-agent-presets'
- id: llm
  name: 'ac-llm'
# llm provider 注册面 = 配置驱动（llm-provider-model-plan P2）：读 config
# llmProviders 注册连接，config 同名条目覆盖内置种子（openai/deepseek/glm
# 退役适配行的缺省原样平移）；热更走 config/changed。
- id: llm-pool
  name: 'ac-llm-pool'
- id: agent-loop
  name: 'ac-agent-loop'
- id: router
  name: 'ac-router'
- id: conversation
  name: 'ac-conversation'
- id: group
  name: 'ac-group'
- id: singles
  name: 'ac-singles'
# 会话设置（llm-provider-model-plan P6/D4）：按 conversationId 的会话级
# 覆盖（模型 name@model 引用）；deliver 边界单点生效。
- id: conv-settings
  name: 'ac-conv-settings'
- id: session
  name: 'ac-session'
- id: persona
  name: 'ac-persona'
- id: system-prompt
  name: 'ac-system-prompt'
- id: memory
  name: 'ac-memory'
# ---- 任务追踪（goal/todo：goal-round 自主推进 + 工具面；状态经消息面
# 到达模型不改写 system（KV cache）；持久化 agentStore entries
# 'goal'/'todo'——桶键 = conversationId ?? agentId，预设 singles 按 sid
# 天然分桶） ----
- id: goal
  name: 'ac-goal'
- id: todo
  name: 'ac-todo'
- id: hello
  name: 'ac-hello'
# ---- M11 工具面（纯库住 ac-edit-core/ac-sandbox-core/ac-text-budget/
# ac-glob-core/ac-web-search-core；行组合决定装载） ----
- id: fs-tools
  name: 'ac-fs-tools'
- id: fs-search
  name: 'ac-fs-search'
- id: str-replace-editor
  name: 'ac-str-replace-editor'
- id: shell-tools
  name: 'ac-shell-tools'
- id: math
  name: 'ac-math'
- id: web-tools
  name: 'ac-web-tools'
- id: dev-tools
  name: 'ac-dev-tools'
- id: restart
  name: 'ac-restart'
- id: session-query
  name: 'ac-session-query'
- id: security
  name: 'ac-security'
- id: subagent
  name: 'ac-subagent'
- id: durable-interaction
  name: 'ac-durable-interaction'
# ---- M12 服务编排（纯库住 ac-archive-core/ac-timer-core/ac-backup-core；
# 行组合决定装载；workspace root = 各持久化行的统一数据根锚点） ----
- id: usage
  name: 'ac-usage'
- id: archive
  name: 'ac-archive'
- id: backup
  name: 'ac-backup'
- id: timers
  name: 'ac-timer'
- id: workspace
  name: 'ac-workspace'
# ---- M13 宿主与可视化（传输基座 + 桥接 + web 表面 + 插件注册；
# 纯库住 ac-ws-protocol/ac-plugin-core/ac-supervisor-core；
# supervisor.mjs 是进程层脚本不经组合根） ----
- id: web-server
  name: 'ac-web-server'
  config:
    port: 3830
    # A1 加固：缺省只绑回环（LAN 不可达）；要暴露到网络必须显式改 host
    # 并自行承担信任边界（配合 allowedOrigins/allowedHosts 放行）
    host: '127.0.0.1'
    # M7：preview WebUI 预构建产物（pnpm --filter ac-webui-app build →
    # preview/webui/dist；SPA fallback 托管，dev 期 vite 3831 proxy → 3830）
    staticDir: './webui/dist'
- id: ws-bridge
  name: 'ac-ws-bridge'
- id: webui
  name: 'ac-webui'
- id: webui-extensions
  name: 'ac-webui-extensions'
- id: plugin-registry
  name: 'ac-plugin-registry'
- id: patch-rpc
  name: './ac-plugin-registry/src/patch-rpc.ts'
- id: plugin-gates
  name: 'ac-plugin-gates'
- id: plugin-market
  name: 'ac-plugin-market'
- id: event-policy
  name: 'ac-event-policy'
# ---- M14 扩展补全（datetime/skill/mcp/协作工具；纯库住
# ac-skill-core/ac-mcp-core/ac-memory-core；行组合决定装载；
# mcp 服务器放行走本行 config.servers，Agent 暴露走 AgentConfig.tools） ----
- id: datetime
  name: 'ac-datetime'
- id: skill
  name: 'ac-skill'
- id: collab-tools
  name: 'ac-collab-tools'
- id: mcp
  name: 'ac-mcp'
# ---- M15 对账补齐（timer 工具面 / job 完成唤醒；ac-group 与
# ac-conversation 持久化与各持久化行同根——缺省 AGENTCHAT_DATA_ROOT
# = 启动 cwd（boot.ts 锚定），不再写死行 config.root） ----
- id: timer-tools
  name: 'ac-timer-tools'
- id: job-wakeup
  name: 'ac-job-wakeup'
# ---- M7 WebUI 接线（ac-web-api：WS RPC 业务方法注册薄编排行；
# ac-agent-admin：Agent 管理面写侧 + 自有 RPC；前端本体 =
# 预构建 dist 进 ac-webui 静态目录，见 docs/m7-webui-plan.md） ----
- id: web-api
  name: 'ac-web-api'
- id: agent-admin
  name: 'ac-agent-admin'
- id: hmr
  name: '@agentchat/cordis-hmr'
  disabled: true
  config:
    root: []
