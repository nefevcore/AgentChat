# ============================================================
# AgentChat src 轨道 —— 配置驱动装配（官方 loader 形态）
#
# 顶层条目表 = include 子树（Loader 官方格式：id/name/config/disabled/inject）。
# 行序无激活语义：Loader 按各行插件的 inject 声明推导依赖（缺服务则该行
# PENDING，服务到位自动激活）。
#
# name = 裸包名（教程/官方形态）：ac-*（根 package.json 声明的 workspace
# 链接）与 @agentchat/cordis-*（vendor 框架行）。解析锚点 = 本文件所在
# 目录（loader 以 baseUrl 为 parentURL 向上走 node_modules）。
# 本地插件直接写相对路径（教程同款：'./my-widget.ts'）。
#
# 启动（官方路径，零自研引导）：
#   cd src && node ./vendor/cordis/bin.js
#   （仓库脚本 pnpm dev）
#
# hmr 行默认 disabled：构造需要 --expose-internals；带 flag 的演示入口
# （pnpm dev:demo）经 include patches 运行时启用，不写回本文件。
# ============================================================
- id: logger-console
  name: '@agentchat/cordis-logger'
- id: timer
  name: '@agentchat/cordis-timer'
- id: tools
  name: 'ac-tools'
- id: jobs
  name: 'ac-jobs'
- id: config
  name: 'ac-config'
- id: credentials
  name: 'ac-credentials'
- id: agent-store
  name: 'ac-agent-store'
- id: agents
  name: 'ac-agents'
- id: agents-dir
  name: 'ac-agents-dir'
- id: agent-presets
  name: 'ac-agent-presets'
# 预设模式数据行（标准/极简注入目录——ac-agent-presets 只做注册中心，
# 数据住独立行：插件注入自有模式同一注册面）
- id: preset-builtin
  name: 'ac-agent-presets-builtin'
- id: llm
  name: 'ac-llm'
# llm provider 注册面 = 配置驱动（llm-provider-model-plan P2）：读 config
# llmProviders 注册连接，config 同名条目覆盖内置种子（openai/deepseek/glm
# 退役适配行的缺省原样平移）；热更走 config/changed。
- id: llm-pool
  name: 'ac-llm-pool'
- id: agent-loop
  name: 'ac-agent-loop'
- id: router
  name: 'ac-router'
- id: conversation
  name: 'ac-conversation'
- id: group
  name: 'ac-group'
- id: singles
  name: 'ac-singles'
# 会话设置（llm-provider-model-plan P6/D4）：按 conversationId 的会话级
# 覆盖（模型 name@model 引用）；deliver 边界单点生效。
- id: conv-settings
  name: 'ac-conv-settings'
- id: session
  name: 'ac-session'
- id: persona
  name: 'ac-persona'
- id: system-prompt
  name: 'ac-system-prompt'
- id: memory
  name: 'ac-memory'
# ---- 任务追踪（goal/todo：goal-round 自主推进 + 工具面；状态经消息面
# 到达模型不改写 system（KV cache）；持久化 agentStore entries
# 'goal'/'todo'——桶键 = conversationId ?? agentId，预设 singles 按 sid
# 天然分桶） ----
- id: goal
  name: 'ac-goal'
- id: todo
  name: 'ac-todo'
- id: hello
  name: 'ac-hello'
# ---- 评测域（ac-bench：套件注册 + 单会话跑批；BFCL 单轮适配器先行，
# 数据源走行 config files/answerFiles，缺省 = 包内样例数据集；真实跑批
# 经 CLI `pnpm bench`——不随宿主自动运行，零常驻开销） ----
- id: bench
  name: 'ac-bench'
# ---- M11 工具面（纯库住 ac-edit-core/ac-sandbox-core/ac-text-budget/
# ac-glob-core/ac-web-search-core；行组合决定装载） ----
- id: fs-tools
  name: 'ac-fs-tools'
- id: fs-search
  name: 'ac-fs-search'
# 会话文件首见快照（方案 C：fs-tools/str-replace-editor 写路径经可选
# 探测消费——本行缺席两工具行不受影响；文件编辑面板的存量初版 diff 底）
- id: file-snapshots
  name: 'ac-file-snapshots'
- id: str-replace-editor
  name: 'ac-str-replace-editor'
- id: shell-tools
  name: 'ac-shell-tools'
# 程序化模式 PTC 内核（run_code 工具：模型写 TS 程序编排成批工具调用；
# 需 code-exec 能力标签；SDK 投影纯库住 ac-run-code-core。程序化形态 =
# 会话级开关（conv-settings programmatic + router 收窄 LLM 面）——
# __programmatic__ 预设已随开关化退役，2026-09-17 research §十）
- id: run-code
  name: 'ac-run-code'
- id: math
  name: 'ac-math'
- id: web-tools
  name: 'ac-web-tools'
# ---- SAP ABAP ADT 工具面（46 个 adt_* 工具；引擎 = npm abap-adt 的
# host-neutral 入口；工具需 sap-adt 能力标签——Agent tags 显式授予才
# 可见；demo 目的地（进程内 mock）默认可用；配置走行 config <
# config.json `sap-adt:` 段 < configFile，热生效） ----
- id: sap-adt
  name: 'ac-sap-adt'
# ABAP 开发模式预设子行（__abap_dev__ 注入预设目录——工具面与预设面
# 独立装配：摘本行不影响 46 个 adt_* 工具）
- id: sap-adt-preset
  name: './ac-sap-adt/src/preset.ts'
- id: dev-tools
  name: 'ac-dev-tools'
# ---- 标签注册中心（tag-registry P1：tool/registered 采集 + 档位/base
