<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- userSpaceOnUse：气泡主体与尾巴共享同一条渐变，接缝无痕 -->
    <linearGradient id="bg" x1="40" y1="16" x2="216" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="128" y1="49" x2="128" y2="173" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 气泡主体：全域圆角方形（正方形图标对齐）+ 左下尾巴（对话语义） -->
  <rect x="8" y="8" width="240" height="224" rx="56" fill="url(#bg)"/>
  <path d="M64 208 L112 208 L46 252 Z" fill="url(#bg)"/>

  <!-- 玻璃高光（沿左上内角） -->
  <path d="M31 82 Q29 35 78 31" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.28"/>

  <!-- 社区氛围光晕（整体，不指向单节点） -->
  <circle cx="128" cy="116" r="60" fill="url(#halo)"/>

  <!-- 网络连线：五边形环 + 五角星对角线（每节点度数 4，无中心） -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="128" y1="62"  x2="179" y2="99"/>
    <line x1="179" y1="99"  x2="160" y2="160"/>
    <line x1="160" y1="160" x2="96"  y2="160"/>
    <line x1="96"  y1="160" x2="77"  y2="99"/>
    <line x1="77"  y1="99"  x2="128" y2="62"/>
    <line x1="128" y1="62"  x2="160" y2="160"/>
    <line x1="128" y1="62"  x2="96"  y2="160"/>
    <line x1="179" y1="99"  x2="96"  y2="160"/>
    <line x1="179" y1="99"  x2="77"  y2="99"/>
    <line x1="160" y1="160" x2="77"  y2="99"/>
  </g>

  <!-- 节点（白底渐变，大小差异 = 活跃度；拓扑上人人平等） -->
  <circle cx="128" cy="62" r="13" fill="url(#nodeGrad)"/>
  <circle cx="179" cy="99" r="12" fill="url(#nodeGrad)"/>
  <circle cx="160" cy="160" r="13" fill="url(#nodeGrad)"/>
  <circle cx="96" cy="160" r="12" fill="url(#nodeGrad)"/>
  <circle cx="77" cy="99" r="13" fill="url(#nodeGrad)"/>

  <!-- 内核（紫色点，社区成员标识） -->
  <circle cx="128" cy="62" r="5" fill="#7c3aed"/>
  <circle cx="179" cy="99" r="4" fill="#7c3aed"/>
  <circle cx="160" cy="160" r="5" fill="#7c3aed"/>
  <circle cx="96" cy="160" r="4" fill="#7c3aed"/>
  <circle cx="77" cy="99" r="5" fill="#7c3aed"/>
</svg>
