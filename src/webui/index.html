<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- P5.5 生产 CSP 审计：只允许 self + 内联样式 + 插件 entry 的 self 静态资源；禁止 remote script -->
  <!-- connect-src 放行回环 127.0.0.1:*：桌面壳存储桥（pickedPort+1..+4）与页面跨端口，
       无此项则 CSP 先于 CORS 拦死桥探活 → 存储管理节静默降级隐藏（2026-09-22 修复） -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* ws: wss:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
  />
  <title>AgentChat</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <style>
    /* 首帧 splash 样式（cr-274）——main.css 尚未加载，令牌不可用，故内联定值；
       底色取双主题 bg-base 的近似（nebula #1a1a1a / aurora #fdfdfb 按系统偏好）。 */
    #boot-splash { position: fixed; inset: 0; z-index: 9000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #1a1a1a; color: #b4bec2; font: 13px/1.5 system-ui, sans-serif; }
    @media (prefers-color-scheme: light) { #boot-splash { background: #fdfdfb; color: #5d646c; } }
    #boot-splash .ring { width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(139, 151, 255, 0.25); border-top-color: #8b97ff;
      animation: boot-spin 0.9s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot-splash .ring { animation-duration: 2s; } }
  </style>
</head>
<body>
  <!-- 首帧 splash（cr-274）：覆盖「HTML 已到、应用 JS 未跑完」的空窗——移动端
       此段资源经 relay 逐个拉取，空窗可达数秒。令牌色对齐 tokens.css 双主题
       （nebula/aurora 同值底），boot 完成（main.ts mount 后）由 JS 移除；
       若 boot 失败则 splash 常驻（比白屏诚实）。busy 环动画属功能语义
       （WCAG essential-motion 豁免），CSS 实现零依赖。 -->
  <div id="boot-splash" aria-busy="true">
    <div class="ring"></div>
    <div class="tip">正在加载 AgentChat…</div>
  </div>
  <div id="app"></div>
  <!-- 最低运行环境垫片（基线 = WebView 92）：必须是 classic 且不带 async/defer
       ——classic 解析到即执行，module 恒 deferred，故必然先于应用代码（位置无关）。
       CSP script-src 'self' 只放行外部脚本，不得改内联。
       基线声明见 public/legacy-runtime.js 文件头，构建期由 check-webview-baseline.mjs 守门 -->
  <script src="/legacy-runtime.js"></script>
  <!-- preview 同源迁移：入口经 preview-main（先装 adapter 防腐层再挂 src UI，见 src/adapter/） -->
  <script type="module" src="/src/preview-main.ts"></script>
</body>
</html>
