<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AgentChat preview</title>
  <style>
    #boot-splash { position: fixed; inset: 0; z-index: 9000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #1a1a1a; color: #b4bec2; font: 13px/1.5 system-ui, sans-serif; }
    @media (prefers-color-scheme: light) { #boot-splash { background: #fdfdfb; color: #5d646c; } }
    #boot-splash .ring { width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(139, 151, 255, 0.25); border-top-color: #8b97ff;
      animation: boot-spin 0.9s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-splash" aria-busy="true">
    <div class="ring"></div>
    <div class="tip">正在加载 AgentChat preview…</div>
  </div>
  <div id="app"></div>
  <script type="module" src="/client/main.ts"></script>
</body>
</html>
